name: Generate Snake Animation

on:
  # Runs automatically every 24 hours at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allows you to run the workflow manually from the Actions tab
  workflow_dispatch:

  # Runs whenever you push changes to the main branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Generate the light and dark snake SVG files
      - name: Generate github-snake.svg and github-snake-dark.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Step 2: Push the generated SVGs to the 'output' branch
      - name: Push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
